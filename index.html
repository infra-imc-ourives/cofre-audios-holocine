<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cofre · 30 Técnicas de Autoterapia</title>
  <meta name="description" content="Cofre com 30 técnicas de autoterapia em áudio. Ouça ou baixe para o seu dispositivo." />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🔐</text></svg>" />
</head>
<body>

  <header class="hero">
    <div class="container">
      <svg class="hero__lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="10" rx="2"></rect>
        <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"></path>
        <circle cx="12" cy="15" r="1.6"></circle>
      </svg>
      <p class="hero__eyebrow" id="hero-tagline">30 Técnicas de Autoterapia</p>
      <h1 class="hero__title" id="hero-title">Cofre</h1>
      <p class="hero__intro" id="hero-intro"></p>
    </div>
  </header>

  <section class="progress">
    <div class="progress__bar-track">
      <div class="progress__bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress__label">
      <span id="progress-count">0 de 30 ouvidos</span>
      <span id="progress-percent">0%</span>
    </div>
  </section>

  <div class="toolbar">
    <input type="search" class="search" id="search-input" placeholder="Buscar técnica por nome..." aria-label="Buscar técnica" />
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <p class="empty-state" id="empty-state">Nenhuma técnica encontrada.</p>
  </main>

  <footer>
    <p>Guarde este link com carinho — o seu Cofre é só seu.</p>
  </footer>

  <div class="player-bar" id="player-bar">
    <span class="player-bar__info" id="player-bar-title">—</span>
    <audio id="player-audio" controls preload="none"></audio>
  </div>

  <script src="assets/js/audios-data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
